<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — Meetme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#321C04">

  <!-- Favicons (Meetme Connection Mark) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">

  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">

  <div class="page-background" aria-hidden="true">
    <div class="subtle-grain"></div>
    <div class="architectural-grid"></div>
  </div>

  <div class="auth-container">
    
    <div class="auth-header" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <a href="/" class="auth-logo" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:10px 20px;background-color:#321C04;color:#FFFFFF;border-radius:100px;box-shadow:0 4px 16px rgba(50,28,4,0.18);transition:transform 0.2s ease;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#2563EB;">
          <circle cx="7.2" cy="5.2" r="2.2"/>
          <circle cx="16.8" cy="5.2" r="2.2"/>
          <path d="M4.5 19.5V13.8C4.5 11.5 6.3 9.8 8.5 9.8C9.6 9.8 10.6 10.2 11.3 11L12 11.8L12.7 11C13.4 10.2 14.4 9.8 15.5 9.8C17.7 9.8 19.5 11.5 19.5 13.8V19.5H16.2V14.2C16.2 13.5 15.6 12.8 14.8 12.8C14.2 12.8 13.6 13.2 13.3 13.8L12 15.8L10.7 13.8C10.4 13.2 9.8 12.8 9.2 12.8C8.4 12.8 7.8 13.5 7.8 14.2V19.5H4.5Z"/>
        </svg>
        <span style="font-family:'Public Sans',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.02em;color:#FFFFFF;">Meetme</span>
      </a>
      <p class="auth-subtitle" style="font-family:'Public Sans',sans-serif;font-size:14px;color:#475569;margin-top:4px;">Create and manage your Meetme digital card</p>
    </div>

    <!-- Auth Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab-btn active" id="tab-login-btn">Sign In</button>
      <button class="auth-tab-btn" id="tab-register-btn">Create Account</button>
    </div>

    <!-- Error / Success Alert -->
    <div class="auth-alert" id="auth-alert" style="display: none;"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address or Username</label>
        <input type="text" id="login-email" class="form-input" placeholder="e.g. dokitoor or email@example.com" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
          <button type="button" id="link-forgot-pass" style="background:none;border:none;color:#4F46E5;font-size:12px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;">Forgot Password?</button>
        </div>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth-submit" id="login-submit-btn">
        <span>Sign In to Dashboard</span>
      </button>

      <p class="auth-footer-note">
        Sign in with your registered Email or Username. (Default: <code>dokitoor</code> / <code>password123</code>)
      </p>
    </form>

    <!-- RESET PASSWORD FORM -->
    <form id="reset-form" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="reset-email" class="form-label">Registered Email Address</label>
        <input type="email" id="reset-email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="reset-username" class="form-label">Card Username (Vanity URL Handle)</label>
        <div class="username-input-wrap">
          <span class="input-prefix">/c/</span>
          <input type="text" id="reset-username" class="form-input username-field" placeholder="yourname" required>
        </div>
        <span class="form-hint">Enter the username handle you chose when creating your card (e.g. <strong>dokitoor</strong>).</span>
      </div>

      <div class="form-group">
        <label for="reset-new-password" class="form-label">New Password</label>
        <input type="password" id="reset-new-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
        <input type="password" id="reset-confirm-password" class="form-input" placeholder="Repeat new password" minlength="6" required>
      </div>

      <button type="submit" class="btn-auth-submit" id="reset-submit-btn">
        <span>Reset Password & Sign In 🔑</span>
      </button>

      <p class="auth-footer-note" style="text-align: center; margin-top: 14px;">
        Remember your password? <button type="button" id="link-back-login" style="background:none;border:none;color:#4F46E5;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;">Sign In Instead</button>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="reg-email" class="form-label">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="reg-username" class="form-label">Choose Username (Your Card URL)</label>
        <div class="username-input-wrap">
          <span class="input-prefix">/c/</span>
          <input type="text" id="reg-username" class="form-input username-field" placeholder="yourname" pattern="[a-zA-Z0-9_-]{3,20}" required>
        </div>
        <span class="form-hint">Your share link will be: <strong>virtualcard.com/c/<span id="username-preview">yourname</span></strong></span>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <button type="submit" class="btn-auth-submit" id="register-submit-btn">
        <span>Create My Free Digital Card</span>
      </button>
    </form>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabLoginBtn = document.getElementById('tab-login-btn');
      const tabRegisterBtn = document.getElementById('tab-register-btn');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const resetForm = document.getElementById('reset-form');
      const linkForgotPass = document.getElementById('link-forgot-pass');
      const linkBackLogin = document.getElementById('link-back-login');
      const authAlert = document.getElementById('auth-alert');
      const regUsername = document.getElementById('reg-username');
      const usernamePreview = document.getElementById('username-preview');

      // Check URL query for tab selection (?tab=register)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'register') {
        switchTab('register');
      }

      function switchTab(tab) {
        authAlert.style.display = 'none';
        if (tab === 'register') {
          tabRegisterBtn.classList.add('active');
          tabLoginBtn.classList.remove('active');
          registerForm.style.display = 'flex';
          loginForm.style.display = 'none';
          resetForm.style.display = 'none';
        } else if (tab === 'reset') {
          tabLoginBtn.classList.remove('active');
          tabRegisterBtn.classList.remove('active');
          loginForm.style.display = 'none';
          registerForm.style.display = 'none';
          resetForm.style.display = 'flex';
          const loginEmailVal = document.getElementById('login-email').value;
          if (loginEmailVal && loginEmailVal.includes('@')) {
            document.getElementById('reset-email').value = loginEmailVal;
          }
        } else {
          tabLoginBtn.classList.add('active');
          tabRegisterBtn.classList.remove('active');
          loginForm.style.display = 'flex';
          registerForm.style.display = 'none';
          resetForm.style.display = 'none';
        }
      }

      tabLoginBtn.addEventListener('click', () => switchTab('login'));
      tabRegisterBtn.addEventListener('click', () => switchTab('register'));
      if (linkForgotPass) linkForgotPass.addEventListener('click', () => switchTab('reset'));
      if (linkBackLogin) linkBackLogin.addEventListener('click', () => switchTab('login'));

      regUsername.addEventListener('input', () => {
        const val = regUsername.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        usernamePreview.textContent = val || 'yourname';
      });

      function showAlert(msg, isError = true) {
        authAlert.textContent = msg;
        authAlert.className = 'auth-alert ' + (isError ? 'alert-error' : 'alert-success');
        authAlert.style.display = 'block';
      }

      // Handle Login
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          let data;
          try {
            data = await res.json();
          } catch {
            throw new Error(`Server returned an unexpected response (${res.status}). Please try again.`);
          }
          if (!res.ok) throw new Error(data.error || 'Invalid email/username or password.');

          localStorage.setItem('card_token', data.token);
          localStorage.setItem('card_user', JSON.stringify(data.user));
          showAlert('Logged in successfully! Redirecting...', false);

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } catch (err) {
          showAlert(err.message);
        }
      });

      // Handle Password Reset
      resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value;
        const username = document.getElementById('reset-username').value;
        const newPassword = document.getElementById('reset-new-password').value;
        const confirmPassword = document.getElementById('reset-confirm-password').value;

        if (newPassword !== confirmPassword) {
          showAlert('New passwords do not match. Please re-enter.');
          return;
        }

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, newPassword })
          });
          let data;
          try {
            data = await res.json();
          } catch {
            throw new Error(`Server returned an unexpected response (${res.status}). Please try again.`);
          }
          if (!res.ok) throw new Error(data.error || 'Password reset failed.');

          localStorage.setItem('card_token', data.token);
          localStorage.setItem('card_user', JSON.stringify(data.user));
          showAlert('🎉 Password reset successfully! Redirecting to dashboard...', false);

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } catch (err) {
          showAlert(err.message);
        }
      });

      // Handle Registration
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reg-email').value;
        const username = regUsername.value.trim().toLowerCase();
        const password = document.getElementById('reg-password').value;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, password })
          });
          let data;
          try {
            data = await res.json();
          } catch {
            throw new Error(`Server returned an unexpected response (${res.status}). Please try again.`);
          }
          if (!res.ok) {
            if (data.error && data.error.toLowerCase().includes('already registered')) {
              throw new Error('This email is already registered! Please switch to the Sign In tab.');
            }
            if (data.error && data.error.toLowerCase().includes('already taken')) {
              throw new Error('This username is already taken. Please choose another username.');
            }
            throw new Error(data.error || 'Registration failed');
          }

          localStorage.setItem('card_token', data.token);
          localStorage.setItem('card_user', JSON.stringify(data.user));
          showAlert('Account created! Loading your editor...', false);

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } catch (err) {
          showAlert(err.message);
        }
      });
    });
  </script>
</body>
</html>
